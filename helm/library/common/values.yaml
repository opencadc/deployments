# Imported into application charts via Chart.yaml import-values (key: standard).
# Site-specific settings belong in helm/environments/<env>/_common.yaml at deploy time.
exports:
  standard:
    replicaCount: 1

    imagePullSecrets: []
    nameOverride: ""
    fullnameOverride: ""

    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

    podAnnotations: {}
    podLabels: {}

    podSecurityContext: {}

    securityContext: {}

    service:
      type: ClusterIP
      port: 8080

    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: chart-example.local
          paths:
            - path: /
              pathType: Prefix
      tls: []

    httpRoute:
      enabled: false
      annotations: {}
      parentRefs:
        - name: gateway
          sectionName: http
      hostnames:
        - chart-example.local
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /

    resources: {}

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80

    volumes: []
    volumeMounts: []

    nodeSelector: {}
    tolerations: []
    affinity: {}

    tomcat:
      connector:
        scheme: ""
        proxyName: ""
        proxyPort: ""
        secure: ""
      catalina:
        connectionTimeout: 180000
        keepAliveTimeout: 180000

    application:
      registryURL: ""
      registryEntries: []
      gmsID: ""
      oidcURI: ""
      resourceID: ""
      cdpResourceID: ""
      identityManagerClass: ""
      enableClientCertHeader: true
      allowBasicATP: false
      applicationName: ""
      catalinaExtra: ""
      logging:
        users: []
        usernames: []
        groups: []
        secret: ""

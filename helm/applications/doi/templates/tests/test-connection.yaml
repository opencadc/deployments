apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doi.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ .Release.Name }}-tomcat-svc:8080{{ .Values.deployment.doi.endpoint | default "/doi" }}/availability']
  restartPolicy: Never

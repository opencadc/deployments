apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tomcat-svc
  namespace: {{ .Release.Namespace }}
  labels:
    run: {{ .Release.Name }}-tomcat-svc
    {{- include "doi.labels" . | nindent 4 }}
spec:
  ports:
    - port: 8080
      name: http-connection
      protocol: TCP
    - port: 80
      targetPort: 8080
      name: http-connection-automatic
      protocol: TCP
  {{- with .Values.service }}
    {{- with .extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  selector:
    run: {{ .Release.Name }}-tomcat

{{- $pgAuth := ((.Values.postgresql | default dict).auth | default dict) }}
{{- $pgSecretName := $pgAuth.existingSecret | default "" }}
{{- $pgSecretKey := $pgAuth.secretKey | default "password" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: posix-mapper-tomcat
  name: posix-mapper-tomcat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ default 1 .Values.replicaCount }}
  selector:
    matchLabels:
      run: posix-mapper-tomcat
  template:
    metadata:
      creationTimestamp: null
      labels:
        run: posix-mapper-tomcat
    spec:
      {{- with .Values.deployment.posixMapper.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.posixMapper.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $pgSecretName }}
      initContainers:
      - image: {{ .Values.deployment.posixMapper.image }}
        imagePullPolicy: {{ .Values.deployment.posixMapper.imagePullPolicy }}
        name: posix-mapper-config
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          cp -R /config-template/. /config
          printf '\norg.opencadc.posix.mapper.password=%s\n' "$PG_PASSWORD" >> /config/catalina.properties
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: {{ $pgSecretKey }}
        volumeMounts:
        - mountPath: "/config-template"
          name: config-template-volume
          readOnly: true
        - mountPath: "/config"
          name: config-volume
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      containers:
      - image: {{ .Values.deployment.posixMapper.image }}
        imagePullPolicy: {{ .Values.deployment.posixMapper.imagePullPolicy }}
        name: posix-mapper-tomcat
        resources:
          requests:
            memory: {{ .Values.deployment.posixMapper.resources.requests.memory }}
            cpu: {{ .Values.deployment.posixMapper.resources.requests.cpu }}
          limits:
            memory: {{ .Values.deployment.posixMapper.resources.limits.memory }}
            cpu: {{ .Values.deployment.posixMapper.resources.limits.cpu }}
        {{- with .Values.deployment.posixMapper.extraEnv }}
        env:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 8080
          protocol: TCP
        {{- with .Values.deployment.posixMapper.extraPorts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: "/config"
          name: config-volume
        {{- with .Values.deployment.posixMapper.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- with .Values.deployment.extraHosts }}
      hostAliases:
{{- range $extraHost := . }}
        - ip: {{ $extraHost.ip }}
          hostnames:
            - {{ $extraHost.hostname }}
{{- end }}
{{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if $pgSecretName }}
      - name: config-volume
        emptyDir: {}
      - name: config-template-volume
        configMap:
          name: posix-mapper-config
      {{- else }}
      - name: config-volume
        configMap:
          name: posix-mapper-config
      {{- end }}
      {{- with .Values.deployment.posixMapper.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

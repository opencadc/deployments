# Cred-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: images.opencadc.org/core/cred
  pullPolicy: IfNotPresent
  tag: "2.0.4-20260929T175724"

application:
  applicationName: cred
  availabilityPath: /cred/availability
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  allowBasicAtp: true
  maxDaysValid: "30.0"
  signingCert:
    existingSecret: cred-signcert
    key: signcert.pem

ingress:
  hosts:
    - host: chart-example.local
      paths:
        - path: /cred
          pathType: Prefix

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cred

livenessProbe:
  httpGet:
    path: /cred/availability
    port: http
readinessProbe:
  httpGet:
    path: /cred/availability
    port: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cred.fullname" . }}
  labels:
    {{- include "cred.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cred.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cred.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cred.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- $signingCert := .Values.application.signingCert | default dict }}
      {{- $cadcproxy := .Values.application.cadcproxy | default dict }}
      {{- $cookieKey := .Values.application.cookieSignaturePublicKey | default dict }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ include "cred.fullname" . }}-config
              - secret:
                  name: {{ required "application.signingCert.existingSecret is required" $signingCert.existingSecret }}
                  items:
                    - key: {{ $signingCert.key | default "signcert.pem" | quote }}
                      path: signcert.pem
              {{- with $cadcproxy.existingSecret }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ $cadcproxy.key | default "cadcproxy.pem" | quote }}
                      path: cadcproxy.pem
              {{- end }}
              {{- with $cookieKey.existingSecret }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ $cookieKey.key | default "RsaSignaturePub.key" | quote }}
                      path: RsaSignaturePub.key
              {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

# AC-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: bucket.canfar.net/ac
  pullPolicy: IfNotPresent
  tag: "1.5.1-20260917T193124"

resources:
  requests:
    memory: "500Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "750m"

serviceAccount:
  create: false
  automount: false

application:
  endpoint: /ac
  availabilityPath: /ac/availability
  resourceID: ivo://example.org/gms
  registryURL: https://example.org/reg
  readUsers: []
  domains: []
  groupNameRules: {}
  logging:
    users: []
    usernames: []
    groups: []
  ldap:
    readOnly:
      servers: ""
      poolInitSize: 4
      poolMaxSize: 100
      poolPolicy: roundRobin
      maxWait: 30000
      createIfNeeded: false
      port:
      secure:
    readWrite:
      servers: ""
      poolInitSize: 4
      poolMaxSize: 10
      poolPolicy: roundRobin
      maxWait: 30000
      createIfNeeded: false
      port:
      secure:
    unboundReadOnly:
      servers: ""
      poolInitSize: 1
      poolMaxSize: 25
      poolPolicy: roundRobin
      maxWait: 30000
      createIfNeeded: false
      port:
      secure:
    port: 636
    proxyUser: ""
    proxyPassword:
      existingSecret: ac-ldap-config
      key: proxyPassword
    usersDN: ""
    groupsDN: ""
    adminGroupsDN: ""
    userRequestsDN: ""
  oidc:
    clients: []
    signingKeys:
      existingSecret: ""
      publicKey: oidc-rsa256-pub.key
      privateKey: oidc-rsa256-priv.key

volumeInit:
  image: busybox:1.36
  imagePullPolicy: IfNotPresent
  securityContext: {}

ingress:
  hosts:
    - host: chart-example.local
      paths:
        - path: /ac
          pathType: Prefix

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ac

livenessProbe:
  httpGet:
    path: /ac/availability
    port: http
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /ac/availability
    port: http
  periodSeconds: 15

startupProbe:
  httpGet:
    path: /ac/availability
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 30
  periodSeconds: 10
  failureThreshold: 30

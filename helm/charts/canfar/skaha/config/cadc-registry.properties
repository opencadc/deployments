#
# local authority map
#
# <base standardID> = <authority>

ivo://ivoa.net/std/GMS#search-1.0 = {{ .Values.application.gmsId }}
ivo://ivoa.net/std/GMS#users-1.0 = {{ .Values.application.gmsId }}
ivo://ivoa.net/std/UMS#users-0.1 = {{ .Values.application.gmsId }}
ivo://ivoa.net/std/UMS#users-1.0 = {{ .Values.application.gmsId }}
ivo://ivoa.net/sso#OAuth = {{ .Values.application.oidcUri }}
ivo://ivoa.net/sso#OpenID = {{ .Values.application.oidcUri }}

{{- if hasSuffix "ACIdentityManager" .Values.application.identityManagerClass }}
# Here to support the ACIdentityManager.  Not used by any other IdentityManager.
ivo://ivoa.net/std/CDP#proxy-1.0 = ivo://cadc.nrc.ca/cred
{{- end }}

{{- with .Values.application.sessions.authorization }}
{{- if and .permissionsAPI .permissionsAPI.enabled }}
ivo://skao.int/std/AuthAPI = {{ .permissionsAPI.authAPIBaseURL | required "authAPIBaseURL is required in .Values.application.sessions.authorization.permissionsAPI.authAPIBaseURL" }}
ivo://skao.int/std/PermissionsAPI = {{ .permissionsAPI.baseURL | required "baseURL is required in .Values.application.sessions.authorization.permissionsAPI.baseURL" }}
{{- end }}
{{- end }}

http://www.opencadc.org/std/posix#group-mapping-0.1 = {{ .Values.application.posixMapperResourceId }}
http://www.opencadc.org/std/posix#user-mapping-0.1 = {{ .Values.application.posixMapperResourceId }}

{{- range .Values.application.registryUrls | default list }}
ca.nrc.cadc.reg.client.RegistryClient.baseURL = {{ . }}
{{- end }}

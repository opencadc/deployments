{{- $connectorProps := include "common.tomcatConnector.properties" (dict "context" .) | trim -}}
{{- if $connectorProps -}}
{{ $connectorProps }}
{{- end -}}
ca.nrc.cadc.auth.PrincipalExtractor.enableClientCertHeader=true
ca.nrc.cadc.util.Log4jInit.messageOnly=true
# (default: ca.nrc.cadc.auth.NoOpIdentityManager)
ca.nrc.cadc.auth.IdentityManager={{ .Values.application.identityManagerClass }}

ca.nrc.cadc.ac.ACIdentityManager.requireCompletePosixPrincipal=true

# database connection pools
{{- with required "UWS Database configuration is required." .Values.application.uws.db }}
org.opencadc.cavern.uws.maxActive={{ .maxActive }}
# org.opencadc.cavern.uws.username and org.opencadc.cavern.uws.password are appended at pod startup from Secret {{ include "cavern.uwsDbAuthSecretName" $ }}
{{- if .url }}
org.opencadc.cavern.uws.url={{ .url }}
{{- else }}
org.opencadc.cavern.uws.url=jdbc:postgresql://{{ $.Release.Name }}-uws-postgres.{{ $.Release.Namespace }}.svc.{{ $.Values.kubernetesClusterDomain | default "cluster.local" }}:5432/{{ .database }}
{{- end }}
{{- end }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    spec.ingressClassName: traefik
spec:
  rules:
  - host: {{ (index .Values.ingress.hosts 0).host | quote }}
    http:
      paths:
      - path: {{ .Values.application.endpoint | default "/cavern" }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-tomcat-svc
            port:
              number: 8080

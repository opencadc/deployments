#
# local authority map
#
# <base standardID> = <authority>

{{- if .Values.application.gmsID }}
ivo://ivoa.net/std/GMS#search-1.0 = {{ .Values.application.gmsID }}
ivo://ivoa.net/std/GMS#users-1.0 = {{ .Values.application.gmsID }}
ivo://ivoa.net/std/UMS#users-0.1 = {{ .Values.application.gmsID }}
ivo://ivoa.net/std/UMS#users-1.0 = {{ .Values.application.gmsID }}
{{- if .Values.application.oidc }}
ivo://ivoa.net/sso#OAuth = {{ .Values.application.oidc.uri }}
ivo://ivoa.net/sso#OpenID = {{ .Values.application.oidc.uri }}
{{- else }}
ivo://ivoa.net/sso#OAuth = {{ .Values.application.gmsID }}
ivo://ivoa.net/sso#OpenID = {{ .Values.application.gmsID }}
{{- end }}
{{- else }}
{{- required "Please set the application.gmsID to the resource ID of the GMS service in the registry" .Values.application.gmsID }}
{{- end }}

{{- if .Values.application.registryURL }}
{{- $raw := .Values.application.registryURL -}}
{{- $urls := ternary (list $raw) $raw (kindIs "string" $raw) -}}
{{- range $urls }}
ca.nrc.cadc.reg.client.RegistryClient.baseURL = {{ . }}
{{- end }}
{{- else }}
{{- required "Please set the application.registryURL to the Registry URL" .Values.application.registryURL }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: storage-ui-tomcat
  name: storage-ui-tomcat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ default 1 .Values.replicaCount }}
  selector:
    matchLabels:
      run: storage-ui-tomcat
  template:
    metadata:
      labels:
        run: storage-ui-tomcat
    spec:
      {{- $oidcSecretName := (include "storageui.oidc.clientSecret.existingSecret" . | trim) }}
      {{- $oidcSecretKey := (include "storageui.oidc.clientSecret.secretKey" . | trim) }}
      {{- $cookieKey := .Values.application.cookieSignaturePublicKey | default dict }}
      {{- $cookieKeySecret := $cookieKey.existingSecret | default dict }}
      {{- $cookieKeySecretName := trim (($cookieKeySecret.name | default "") | toString) }}
      {{- $cookieKeyPath := trim (($cookieKeySecret.path | default "RsaSignaturePub.key") | toString) }}
      {{- if empty $cookieKeyPath }}
      {{- $cookieKeyPath = "RsaSignaturePub.key" }}
      {{- end }}
      {{- with .Values.application.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $oidcSecretName }}
      initContainers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: storage-ui-config
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          cp -R /config-template/. /config
          printf '\norg.opencadc.vosui.oidc.clientSecret = %s\n' "$OIDC_CLIENT_SECRET" >> /config/org.opencadc.vosui.properties
        env:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $oidcSecretName }}
              key: {{ $oidcSecretKey | default "clientSecret" }}
        volumeMounts:
        - mountPath: "/config-template"
          name: config-template-volume
        - mountPath: "/config"
          name: config-volume
      {{- end }}
      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: storage-ui-tomcat
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          protocol: TCP
        {{- with .Values.application.extraPorts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: "/config"
          name: config-volume
        {{- with .Values.application.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.application.extraEnv }}
        env:
        {{- with .Values.application.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
{{- with .Values.extraHosts }}
      hostAliases:
{{- range $extraHost := . }}
        - ip: {{ $extraHost.ip }}
          hostnames:
            - {{ $extraHost.hostname }}
{{- end }}
{{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: config-volume
        {{- if $oidcSecretName }}
        emptyDir: {}
        {{- else if $cookieKeySecretName }}
        projected:
          sources:
          - configMap:
              name: storage-ui-config
          - secret:
              name: {{ $cookieKeySecretName }}
              items:
              - key: RsaSignaturePub.key
                path: {{ $cookieKeyPath | quote }}
        {{- else }}
        configMap:
          name: storage-ui-config
        {{- end }}
      {{- if $oidcSecretName }}
      - name: config-template-volume
        {{- if $cookieKeySecretName }}
        projected:
          sources:
          - configMap:
              name: storage-ui-config
          - secret:
              name: {{ $cookieKeySecretName }}
              items:
              - key: RsaSignaturePub.key
                path: {{ $cookieKeyPath | quote }}
        {{- else }}
        configMap:
          name: storage-ui-config
        {{- end }}
      {{- end }}
      {{- with .Values.application.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

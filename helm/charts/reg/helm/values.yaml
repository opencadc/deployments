# Default values for reg.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: images.opencadc.org/core/reg
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.2.2"

# -- Begin application specific parameters. --
application:
  # Required VOSI-enabled API (web service) entries. Rendered into reg-resource-caps.properties.
  # See: https://github.com/opencadc/reg/tree/main/reg#reg-resource-capsproperties-optional
  # Example:
  #  - id: "ivo://cadc.nrc.ca/service/mycustomentry"
  #    url: "https://example.com/mylink/capabilities"
  serviceEntries: []

  # Optional web application (user interface) entries. Rendered into reg-applications.properties.
  # See: https://github.com/opencadc/reg/tree/main/reg#reg-applicationsproperites-optional-experimental
  # Example:
  #  - id: "ivo://cadc.nrc.ca/ui/mycustomentry"
  #    url: "https://example.com/mylink"
  applicationEntries: []

  # Optionally configure log level administration for specific users or groups.
  logging:
    # List of distinguished names that should have enhanced logging.
    # Example:
    #  - "CN=Audit User,OU=CADC,O=CADC,C=CA"
    #  - "CN=Another Audit,OU=CADC,O=CADC,C=CA"
    # userDistinguishedNames: []

    # List of usernames that should have enhanced logging.
    # Example:
    #  - "audituser"
    #  - "anotheraudit"
    # usernames: []

    # List of group IVOA URIs that should have enhanced logging.
    # Example:
    #  - "ivo://cadc.nrc.ca/gms/auditgroup"
    #  - "ivo://cadc.nrc.ca/gms/anotherauditgroup"
    # groups: []

  # IdentityManager class written to catalina.properties when set.
  # Example: ca.nrc.cadc.ac.ACIdentityManager
  identityManagerClass: ""

  # RSA public key at /config/RsaSignaturePub.key.
  # - If existingSecret is set: mount that Secret key as a file (GitOps/Argo-friendly; no Helm lookup).
  #   Secret must exist in the release namespace before the pod starts; key name RsaSignaturePub.key.
  # - Otherwise, when value is set: embed the PEM in ConfigMap binaryData
  #   (e.g. --set-file application.rsaSignaturePublicKey.value=...).
  rsaSignaturePublicKey:
    existingSecret: ""
    value: ""

# -- End application specific parameters. --

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Public URL for Tomcat behind a reverse proxy
# These values are written to catalina.properties as tomcat.connector.* and tell
# Tomcat the URL clients use to reach the service (equivalent to X-Forwarded-Proto,
# X-Forwarded-Host, and X-Forwarded-Port). They affect VOSI capabilities output:
# accessURL hostnames are rewritten to match the incoming request URL.
#
# Resolution order (per field):
#   1. Explicit value set here
#   2. Auto-derived from httpRoute (if enabled) or ingress (if enabled)
#   3. Omitted from catalina.properties if proxyName cannot be resolved
#
# Internal-only deployment (defaults):
#   With ingress.enabled=false, httpRoute.enabled=false, service.type=ClusterIP,
#   and these fields left empty, no tomcat.connector.* properties are emitted.
#   The service remains ClusterIP-only (reachable by Pods in the cluster) and
#   Tomcat uses the URL from each incoming request as-is. VOSI accessURLs will
#   reflect the internal hostname callers use (e.g. <release>-reg.<namespace>.svc.cluster.local).
#
# Override when the public URL differs from ingress/httpRoute hostnames, e.g. a CDN
# or external load balancer in front of the cluster ingress.
tomcat:
  connector:
    # Public URL scheme. Auto-derived as https (httpRoute or ingress with TLS) or http.
    scheme: ""
    # Public URL hostname. Auto-derived from httpRoute.hostnames[0] or ingress.hosts[0].host.
    proxyName: ""
    # Public URL port. Auto-derived as 443 (https) or 80 (http).
    proxyPort: ""
    # Public URL secure. Auto-derived as true (https) or false (http).
    secure: false

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:

readinessProbe:

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

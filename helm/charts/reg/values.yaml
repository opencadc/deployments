# Reg-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: images.opencadc.org/core/reg
  pullPolicy: IfNotPresent
  tag: "1.2.2"

application:
  # Required at deploy time (helm template fails when empty).
  serviceEntries: []
  applicationEntries: []
  rsaSignaturePublicKey:
    existingSecret: ""
    value: ""

ingress:
  hosts: []

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /reg

# Bifrost-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: images.opencadc.org/caom2/bifrost
  pullPolicy: Always
  tag: "0.5.8"

application:
  gmsId: ""
  cdpResourceId: ""
  registryUrls: []
  localAuthorities: []
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  cookieSignaturePublicKey:
    existingSecret: ""
    key: RsaSignaturePub.key
  logging:
    groups: []

  uws: {}
  queryService: ""
  locatorService: ""
  readGrantProvider: ""

ingress:
  hosts:
    - host: chart-example.local
      paths:
        - path: /bifrost
          pathType: Prefix

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bifrost

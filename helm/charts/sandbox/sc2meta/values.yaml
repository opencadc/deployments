# SC2meta-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: images.opencadc.org/caom2/sc2meta
  pullPolicy: IfNotPresent
  tag: "0.9.4"

podSecurityContext: {}

securityContext:
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 2500Mi
  requests:
    cpu: 250m
    memory: 256Mi

application:
  gmsId: ""
  cdpResourceId: ""
  registryUrls: []
  localAuthorities: []
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  cookieSignaturePublicKey:
    existingSecret: ""
    key: RsaSignaturePub.key
  logging:
    groups: []

  uws: {}

ingress:
  hosts:
    - host: chart-example.local
      paths:
        - path: /sc2meta
          pathType: Prefix

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sc2meta

# Torkeep-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: images.opencadc.org/caom2/torkeep
  pullPolicy: IfNotPresent
  tag: "0.1.6"

application:
  gmsId: ""
  cdpResourceId: ""
  registryUrls: []
  localAuthorities: []
  identityManagerClass: ca.nrc.cadc.ac.ACIdentityManager
  cookieSignaturePublicKey:
    existingSecret: ""
    key: RsaSignaturePub.key
  logging:
    groups: []

  caom2Metadata: {}
  grantProviders: []
  collections: []

ingress:
  hosts:
    - host: chart-example.local
      paths:
        - path: /torkeep
          pathType: Prefix

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /torkeep

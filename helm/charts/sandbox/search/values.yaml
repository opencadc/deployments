# Search UI-specific defaults. Shared keys from library/common (import-values) and environment overlays.

image:
  repository: images.opencadc.org/caom2/search
  pullPolicy: IfNotPresent
  tag: ""

service:
  port: 80

ingress:
  hosts:
    - host: chart-example.local
      paths:
        - path: /search
          pathType: Prefix

httpRoute:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /search

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
